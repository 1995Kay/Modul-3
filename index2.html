<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .red {
        background-color: rgb(255, 0, 0);
      }
    </style>
    <script>
      var red = false;
      function toggelRed() {
        var element = document.getElementById("red");
        if (red) {
          element.classList.remove("red");
        } else element.classList.add("red");
        red = !red;
      }
    </script>
  </head>

  <body>
    <button id="red" onclick="toggelRed()">rot</button>
  </body>
</html>
