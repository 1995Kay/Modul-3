<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preisrechner</title>
    <script src="index.js"></script>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <div class="main-container">
        <h1>Preisrechner</h1>
        <div class="main-button">
          <button class="text">Currywurst<span>4,50 €</span></button>
          <button class="text">Mantaplatte<span>7,50 €</span></button>
          <button class="text">Pommes<span>3,00 €</span></button>
          <button class="text">Süßkartoffel<span>5,90 €</span></button>

          <button class="text">Frikadelle<span>3,50 €</span></button>
          <button class="text">Schnitzel<span>8,90 €</span></button>
          <button class="text">Crossies<span>6,50 €</span></button>
          <button class="text">Veggie Wurst<span>5,50 €</span></button>

          <button class="text">Krautsalat<span>3,50 €</span></button>
          <button class="text">Kartoffelsalat<span>3,90 €</span></button>
          <button class="text">Cola / Zero<span>2,50 €</span></button>
          <button class="text">Limo<span>2,50 €</span></button>

          <button class="text">Wasser<span>2,00 €</span></button>
          <button class="text">Apfelschorle<span>2,50 €</span></button>
          <button class="text">Altbier<span>3,00 €</span></button>
          <button class="text">Pils<span>3,00 €</span></button>
        </div>
        <hr />
        <button class="rest end">Rest</button>
        <div class="order-buttons">
          <button class="vorort end">Vor Ort</button>
          <button class="lieferung end">Lieferung</button>
        </div>
      </div>
      <div class="cart-container">
        <h2>Warenkorb</h2>
      </div>
    </main>
  </body>
</html>
